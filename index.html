
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">

  <title>Vinos Dough Calculator</title>

  <!-- iPhone / iPad Home Screen -->
  <meta name="apple-mobile-web-app-title" content="Vinos Dough">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./5594E753-63EB-41E3-B6E1-62F419851B0D.png">

  <!-- Normal browser / Android metadata -->
  <meta name="theme-color" content="#f5f1ea">
  <link rel="icon" href="./5594E753-63EB-41E3-B6E1-62F419851B0D.png">
  <link rel="manifest" href="./site.webmanifest">

  <style>
    :root{
      color-scheme:light;
      --bg:#f5f1ea;
      --text:#171717;
      --muted:#6f665d;
      --border:#ddd4c9;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{display:grid;place-items:center;padding:28px}
    main{text-align:center;max-width:360px}
    img{width:112px;height:112px;border-radius:24px;display:block;margin:0 auto 20px}
    h1{font-size:22px;margin:0 0 8px}
    p{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
    .error{display:none;margin-top:18px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff}
    .error strong{display:block;margin-bottom:5px}
  </style>
</head>
<body>
  <main>
    <img src="./5594E753-63EB-41E3-B6E1-62F419851B0D.png" alt="">
    <h1>Vinos Dough Calculator</h1>
    <p id="status">Opening calculator…</p>
    <div class="error" id="configError">
      <strong>Launcher not configured</strong>
      Paste the Google Apps Script <code>/exec</code> URL into <code>index.html</code>.
    </div>
  </main>

  <script>
    'use strict';

    // ==========================================================
    // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT /exec URL HERE:
    const CALCULATOR_URL = 'https://script.google.com/macros/s/AKfycbxgwJwVJwlfIPBnlB9iPcGFFAcacJ_mMk7dZrUAoV1CH1K9yZfxGT_VD12Opp9yfLvU/exec';
    // ==========================================================

    const valid =
      /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:[?#].*)?$/.test(CALCULATOR_URL);

    if (valid) {
      // replace() keeps the GitHub launcher out of the Back-button history.
      window.location.replace(CALCULATOR_URL);
    } else {
      document.getElementById('status').style.display = 'none';
      document.getElementById('configError').style.display = 'block';
    }
  </script>
</body>
</html>
