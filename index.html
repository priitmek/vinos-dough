<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">

  <title>Vinos Dough Calculator</title>

  <meta name="apple-mobile-web-app-title" content="Vinos Dough">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./5594E753-63EB-41E3-B6E1-62F419851B0D.png">

  <meta name="theme-color" content="#f5f1ea">
  <link rel="icon" href="./5594E753-63EB-41E3-B6E1-62F419851B0D.png">
  <link rel="manifest" href="./site.webmanifest">

  <style>
    :root{
      color-scheme:light;
      --bg:#f5f1ea;
      --text:#171717;
      --muted:#6f665d;
      --border:#ddd4c9;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);color:var(--text)
    }
    body{display:grid;place-items:center;padding:28px}
    main{text-align:center;max-width:380px;width:100%}
    .icon{width:112px;height:112px;border-radius:24px;display:block;margin:0 auto 20px}
    h1{font-size:22px;margin:0 0 8px}
    p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px}
    .install{
      text-align:left;background:var(--card);border:1px solid var(--border);
      border-radius:16px;padding:16px;margin-top:18px
    }
    .install strong{display:block;margin-bottom:7px}
    .install ol{margin:0;padding-left:22px;color:var(--muted);font-size:14px;line-height:1.55}
    button{
      width:100%;margin-top:18px;border:0;border-radius:12px;
      background:#111;color:#fff;padding:14px 16px;
      font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .error{
      display:none;margin-top:18px;padding:14px;border:1px solid var(--border);
      border-radius:12px;background:#fff;text-align:left;font-size:14px
    }
    .error strong{display:block;margin-bottom:5px}
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./5594E753-63EB-41E3-B6E1-62F419851B0D.png" alt="">
    <h1>Vinos Dough Calculator</h1>
    <p id="status">Install this launcher on your Home Screen for quick access.</p>

    <div class="install" id="installHelp">
      <strong>On iPhone</strong>
      <ol>
        <li>Tap Safari's Share button.</li>
        <li>Choose <b>Add to Home Screen</b>.</li>
        <li>Open the new Vinos Dough icon.</li>
      </ol>
    </div>

    <button type="button" id="openButton">Open calculator now</button>

    <div class="error" id="configError">
      <strong>Launcher not configured</strong>
      Paste the Google Apps Script <code>/exec</code> URL into <code>index.html</code>.
    </div>
  </main>

  <script>
    'use strict';

    // ==========================================================
    // KEEP YOUR EXISTING DEPLOYED GOOGLE APPS SCRIPT /exec URL HERE:
    const CALCULATOR_URL = 'https://script.google.com/macros/s/AKfycbxgwJwVJwlfIPBnlB9iPcGFFAcacJ_mMk7dZrUAoV1CH1K9yZfxGT_VD12Opp9yfLvU/exec';
    // ==========================================================

    const valid =
      /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:[?#].*)?$/.test(CALCULATOR_URL);

    const isStandalone =
      window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

    const launchedByManifest =
      new URLSearchParams(window.location.search).get('launch') === '1';

    const openCalculator = () => {
      if (!valid) {
        document.getElementById('configError').style.display = 'block';
        return;
      }
      window.location.replace(CALCULATOR_URL);
    };

    document.getElementById('openButton').addEventListener('click', openCalculator);

    if (!valid) {
      document.getElementById('configError').style.display = 'block';
      document.getElementById('openButton').disabled = true;
    } else if (isStandalone || launchedByManifest) {
      // Important: only redirect automatically AFTER the launcher has been
      // installed/launched. Normal Safari stays on GitHub so iOS can read
      // the apple-touch-icon when "Add to Home Screen" is used.
      document.getElementById('status').textContent = 'Opening calculator…';
      document.getElementById('installHelp').style.display = 'none';
      document.getElementById('openButton').style.display = 'none';
      openCalculator();
    }
  </script>
</body>
</html>
